<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadetes</title>
</head>
<body>
  <h1>Cadetes</h1>

  <form id="login" hidden>
    <p><label>Usuario<br><input name="username" autocomplete="username" autocapitalize="none" required></label></p>
    <p><label>Contraseña<br><input name="password" type="password" autocomplete="current-password" required></label></p>
    <p><button type="submit">Entrar</button></p>
    <p id="error" role="alert"></p>
  </form>

  <div id="sesion" hidden>
    <p>Entraste como <strong id="nombre"></strong> (<span id="rol"></span>).</p>
    <p><button id="salir" type="button">Salir</button></p>
  </div>

  <div id="admin" hidden>
    <h2>Nuevo pedido</h2>
    <form id="nuevo-pedido">
      <p><label>Dirección de retiro<br><input name="pickup_address" autocomplete="off" maxlength="200" required></label></p>
      <p><label>Dirección de entrega<br><input name="dropoff_address" autocomplete="off" maxlength="200" required></label></p>
      <p><label>Precio en pesos (ej.: 1500 o 1500,50)<br><input name="precio" inputmode="decimal" autocomplete="off" required></label></p>
      <p><label>Cadete<br><select name="courier_id" id="cadetes" required></select></label></p>
      <p><button type="submit" id="crear-pedido">Crear pedido</button></p>
      <p id="resultado-pedido" role="status"></p>
    </form>

    <h2>Nuevo cadete</h2>
    <form id="nuevo-cadete">
      <p><label>Usuario<br><input name="username" autocomplete="off" autocapitalize="none" required></label></p>
      <p><label>Nombre<br><input name="name" autocomplete="off" required></label></p>
      <p><label>Contraseña<br><input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required></label></p>
      <p><button type="submit">Crear cadete</button></p>
      <p id="resultado-cadete" role="status"></p>
    </form>

    <h2>Usuarios</h2>
    <p id="error-usuarios" role="alert"></p>
    <table>
      <thead>
        <tr><th>Usuario</th><th>Nombre</th><th>Rol</th><th>Activo</th></tr>
      </thead>
      <tbody id="usuarios"></tbody>
    </table>
  </div>

  <div id="pedidos" hidden>
    <h2 id="titulo-pedidos">Pedidos</h2>
    <p><button id="actualizar-pedidos" type="button">Actualizar</button></p>
    <p id="error-pedidos" role="alert"></p>
    <p id="sin-pedidos" hidden>No hay pedidos.</p>
    <table>
      <thead><tr id="columnas-pedidos"></tr></thead>
      <tbody id="filas-pedidos"></tbody>
    </table>
  </div>

  <script>
    const form = document.getElementById('login');
    const sesion = document.getElementById('sesion');
    const error = document.getElementById('error');
    const admin = document.getElementById('admin');
    const nuevoCadete = document.getElementById('nuevo-cadete');
    const resultadoCadete = document.getElementById('resultado-cadete');
    const nuevoPedido = document.getElementById('nuevo-pedido');
    const resultadoPedido = document.getElementById('resultado-pedido');
    const selectCadetes = document.getElementById('cadetes');
    const pedidos = document.getElementById('pedidos');

    let usuarioActual = null;

    const pesos = new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS' });
    const fecha = new Intl.DateTimeFormat('es-AR', {
      dateStyle: 'short', timeStyle: 'short', timeZone: 'America/Argentina/Buenos_Aires',
    });

    // "1500" o "1500,50" (también con punto) → centavos, sin pasar por
    // decimales de punto flotante. Sin separador de miles: "1.500" es inválido
    // para no confundirlo con 1,5.
    function pesosACentavos(texto) {
      const m = /^(\d+)(?:[.,](\d{1,2}))?$/.exec(texto.trim());
      if (!m) return null;
      const centavos = Number(m[1]) * 100 + Number((m[2] || '').padEnd(2, '0'));
      return Number.isSafeInteger(centavos) && centavos > 0 ? centavos : null;
    }

    function mostrar(usuario) {
      usuarioActual = usuario;
      form.hidden = !!usuario;
      sesion.hidden = !usuario;
      pedidos.hidden = !usuario;
      const esAdmin = !!usuario && usuario.role === 'admin';
      admin.hidden = !esAdmin;
      if (usuario) {
        document.getElementById('nombre').textContent = usuario.name;
        document.getElementById('rol').textContent = usuario.role;
        document.getElementById('titulo-pedidos').textContent = esAdmin ? 'Pedidos' : 'Mis pedidos';
        cargarPedidos();
      } else {
        document.getElementById('filas-pedidos').replaceChildren();
        document.getElementById('error-pedidos').textContent = '';
      }
      if (esAdmin) {
        cargarUsuarios();
        cargarCadetes();
      } else {
        document.getElementById('usuarios').replaceChildren();
        selectCadetes.replaceChildren();
        resultadoCadete.textContent = '';
        resultadoPedido.textContent = '';
      }
    }

    async function cargarUsuarios() {
      const errorUsuarios = document.getElementById('error-usuarios');
      errorUsuarios.textContent = '';
      const res = await fetch('/api/usuarios');
      const cuerpo = await res.json().catch(() => null);
      if (!res.ok) {
        errorUsuarios.textContent = (cuerpo && cuerpo.error) || 'No se pudo cargar el listado';
        return;
      }
      const filas = cuerpo.map((u) => {
        const tr = document.createElement('tr');
        for (const valor of [u.username, u.name, u.role, u.active ? 'sí' : 'no']) {
          const td = document.createElement('td');
          td.textContent = valor;
          tr.append(td);
        }
        return tr;
      });
      document.getElementById('usuarios').replaceChildren(...filas);
    }

    async function cargarCadetes() {
      const elegido = selectCadetes.value;
      const res = await fetch('/api/cadetes');
      const cuerpo = await res.json().catch(() => null);
      const botonCrear = document.getElementById('crear-pedido');
      if (!res.ok) {
        selectCadetes.replaceChildren(new Option('No se pudieron cargar los cadetes', ''));
        botonCrear.disabled = true;
        return;
      }
      if (cuerpo.length === 0) {
        selectCadetes.replaceChildren(new Option('No hay cadetes activos', ''));
        botonCrear.disabled = true;
        return;
      }
      const opciones = cuerpo.map((c) => new Option(`${c.name} (${c.username})`, String(c.id)));
      selectCadetes.replaceChildren(new Option('Elegí un cadete', ''), ...opciones);
      if (cuerpo.some((c) => String(c.id) === elegido)) selectCadetes.value = elegido;
      botonCrear.disabled = false;
    }

    async function cargarPedidos() {
      const errorPedidos = document.getElementById('error-pedidos');
      errorPedidos.textContent = '';
      const res = await fetch('/api/pedidos');
      const cuerpo = await res.json().catch(() => null);
      if (!res.ok) {
        errorPedidos.textContent = (cuerpo && cuerpo.error) || 'No se pudieron cargar los pedidos';
        return;
      }
      const esAdmin = usuarioActual && usuarioActual.role === 'admin';
      const columnas = ['N°', 'Fecha', 'Retiro', 'Entrega', 'Precio', 'Estado'];
      if (esAdmin) columnas.push('Cadete');
      document.getElementById('columnas-pedidos').replaceChildren(...columnas.map((c) => {
        const th = document.createElement('th');
        th.textContent = c;
        return th;
      }));
      const filas = cuerpo.map((p) => {
        const tr = document.createElement('tr');
        const valores = [
          p.id, fecha.format(new Date(p.created_at)), p.pickup_address, p.dropoff_address,
          pesos.format(p.price_cents / 100), p.status,
        ];
        if (esAdmin) valores.push(p.courier_name || '—');
        for (const valor of valores) {
          const td = document.createElement('td');
          td.textContent = valor;
          tr.append(td);
        }
        return tr;
      });
      document.getElementById('filas-pedidos').replaceChildren(...filas);
      document.getElementById('sin-pedidos').hidden = cuerpo.length > 0;
    }

    nuevoPedido.addEventListener('submit', async (e) => {
      e.preventDefault();
      resultadoPedido.textContent = '';
      const datos = Object.fromEntries(new FormData(nuevoPedido));
      const centavos = pesosACentavos(datos.precio);
      if (centavos === null) {
        resultadoPedido.textContent = 'Precio inválido: solo números, con hasta dos decimales y sin separador de miles (ej.: 1500 o 1500,50).';
        return;
      }
      const res = await fetch('/api/pedidos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          pickup_address: datos.pickup_address,
          dropoff_address: datos.dropoff_address,
          price_cents: centavos,
          courier_id: Number(datos.courier_id),
        }),
      });
      const cuerpo = await res.json().catch(() => ({}));
      if (!res.ok) {
        resultadoPedido.textContent = cuerpo.error || 'No se pudo crear el pedido';
        cargarCadetes(); // por si el cadete elegido se dio de baja
        return;
      }
      nuevoPedido.reset();
      resultadoPedido.textContent = `Pedido ${cuerpo.id} creado y asignado.`;
      cargarPedidos();
    });

    nuevoCadete.addEventListener('submit', async (e) => {
      e.preventDefault();
      resultadoCadete.textContent = '';
      const datos = Object.fromEntries(new FormData(nuevoCadete));
      const res = await fetch('/api/usuarios', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...datos, role: 'cadete' }),
      });
      const cuerpo = await res.json().catch(() => ({}));
      if (!res.ok) {
        resultadoCadete.textContent = cuerpo.error || 'No se pudo crear el cadete';
        return;
      }
      nuevoCadete.reset();
      resultadoCadete.textContent = `Cadete ${cuerpo.username} creado.`;
      cargarUsuarios();
      cargarCadetes();
    });

    document.getElementById('actualizar-pedidos').addEventListener('click', cargarPedidos);

    async function cargarSesion() {
      const res = await fetch('/api/sesion');
      mostrar(res.ok ? await res.json() : null);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      error.textContent = '';
      const datos = Object.fromEntries(new FormData(form));
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(datos),
      });
      const cuerpo = await res.json().catch(() => ({}));
      if (!res.ok) {
        error.textContent = cuerpo.error || 'No se pudo entrar';
        return;
      }
      form.reset();
      mostrar(cuerpo);
    });

    document.getElementById('salir').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      mostrar(null);
    });

    cargarSesion();
  </script>
</body>
</html>
